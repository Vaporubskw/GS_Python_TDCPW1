
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuraPy | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05070c;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #0c111b;
            border: 1px solid #1c293a;
            border-radius: 14px;
        }

        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 13px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #05070c;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .erro {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            background: #450a0a;
            color: #fecaca;
            font-size: 13px;
            text-align: center;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="login">

        <h1>SecuraPy</h1>

        <p class="subtitulo">
            Plataforma de Monitoramento e Segurança
        </p>

        <form method="POST" action="{{ url_for('login') }}">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="operador@securapy.local"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar</button>

        </form>

        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <footer>
            Acesso restrito a operadores autorizados.
        </footer>

    </main>

</body>
</html>
